<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 345" width="620" height="345" role="img" aria-label="Plane gate: mặt phẳng RANSAC và điểm sau fusion đi qua bốn điều kiện AND; trên scene dev điều kiện w_k chỉ 3,6% điểm đạt nên 0,64% điểm được kéo">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B73"/></marker>
  </defs>
  <rect width="620" height="345" fill="#FFFFFF"/>
  <g font-family="Calibri, Arial, sans-serif" fill="#10303A">
    <rect x="4" y="30" width="158" height="96" rx="6" fill="#E8F2F4" stroke="#1E7A8C"/>
    <text x="83" y="52" font-size="13.5" font-weight="bold" fill="#1E7A8C" text-anchor="middle">Mặt phẳng</text>
    <text x="83" y="71" font-size="12" text-anchor="middle">RANSAC tuần tự ≤ 8</text>
    <text x="83" y="88" font-size="12" text-anchor="middle">sàn = mặt ngang thấp</text>
    <text x="83" y="104" font-size="12" text-anchor="middle">nhất; thêm lượt tìm</text>
    <text x="83" y="119" font-size="12" text-anchor="middle">tường</text>
    <rect x="4" y="190" width="158" height="78" rx="6" fill="#E8F2F4" stroke="#1E7A8C"/>
    <text x="83" y="214" font-size="13.5" font-weight="bold" fill="#1E7A8C" text-anchor="middle">Điểm P_k + w_k</text>
    <text x="83" y="234" font-size="12" text-anchor="middle">từ fuse</text>
    <text x="83" y="252" font-size="12" text-anchor="middle">pháp tuyến: knn riêng</text>
    <!-- bus -->
    <line x1="162" y1="78" x2="182" y2="78" stroke="#5B6B73" stroke-width="1.5"/>
    <line x1="162" y1="229" x2="182" y2="229" stroke="#5B6B73" stroke-width="1.5"/>
    <line x1="182" y1="40" x2="182" y2="302" stroke="#5B6B73" stroke-width="1.5"/>
    <line x1="182" y1="40" x2="198" y2="40" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="182" y1="120" x2="198" y2="120" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="182" y1="200" x2="198" y2="200" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="182" y1="302" x2="198" y2="302" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="300" y="12" font-size="11.5" fill="#5B6B73" text-anchor="middle" font-style="italic">tỉ lệ điểm đạt từng điều kiện, scene dev</text>
    <!-- conditions -->
    <rect x="200" y="16" width="200" height="50" rx="6" fill="#FFFFFF" stroke="#1E7A8C"/>
    <text x="210" y="37" font-size="13" font-weight="bold">r_k &lt; τ_r = 0,05 m</text>
    <text x="210" y="56" font-size="12" fill="#5B6B73">gần mặt phẳng</text>
    <text x="392" y="56" font-size="13" font-weight="bold" fill="#1E7A8C" text-anchor="end">40,4%</text>
    <rect x="200" y="96" width="200" height="50" rx="6" fill="#FFFFFF" stroke="#1E7A8C"/>
    <text x="210" y="117" font-size="13" font-weight="bold">θ_k &lt; τ_n = 15°</text>
    <text x="210" y="136" font-size="12" fill="#5B6B73">pháp tuyến phù hợp</text>
    <text x="392" y="136" font-size="13" font-weight="bold" fill="#1E7A8C" text-anchor="end">32,9%</text>
    <rect x="200" y="176" width="200" height="50" rx="6" fill="#FFFFFF" stroke="#1E7A8C"/>
    <text x="210" y="197" font-size="13" font-weight="bold">s_k ∈ sàn / tường / trần</text>
    <text x="210" y="216" font-size="12" fill="#5B6B73">không phải đồ vật</text>
    <rect x="200" y="278" width="200" height="50" rx="6" fill="#FBEEEC" stroke="#C8453B" stroke-width="1.5"/>
    <text x="210" y="299" font-size="13" font-weight="bold">w_k &gt; τ_w = 0,5</text>
    <text x="210" y="318" font-size="12" fill="#5B6B73">đủ tin cậy · nút cổ chai</text>
    <text x="392" y="318" font-size="13" font-weight="bold" fill="#C8453B" text-anchor="end">3,6%</text>
    <!-- AND -->
    <g stroke="#5B6B73" stroke-width="1.5" fill="none">
      <path d="M400 41 L452 160"/><path d="M400 121 L446 166"/><path d="M400 201 L446 178"/><path d="M400 303 L452 186"/>
    </g>
    <circle cx="470" cy="173" r="24" fill="#10303A"/>
    <text x="470" y="178" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AND</text>
    <path d="M490 160 L520 95" fill="none" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M490 186 L520 250" fill="none" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="522" y="50" width="94" height="84" rx="6" fill="#E9F5EE" stroke="#3E9B6B"/>
    <text x="569" y="72" font-size="13" font-weight="bold" fill="#2E7A52" text-anchor="middle">g_k = 1</text>
    <text x="569" y="90" font-size="12" text-anchor="middle">kéo về mặt</text>
    <text x="569" y="106" font-size="12" text-anchor="middle">α = 0,5 (25)</text>
    <text x="569" y="124" font-size="12" font-weight="bold" fill="#2E7A52" text-anchor="middle">dev: 0,64%</text>
    <rect x="522" y="215" width="94" height="70" rx="6" fill="#F4F7F8" stroke="#D5DEE2"/>
    <text x="569" y="238" font-size="13" font-weight="bold" text-anchor="middle">g_k = 0</text>
    <text x="569" y="256" font-size="12" text-anchor="middle">giữ nguyên,</text>
    <text x="569" y="272" font-size="12" text-anchor="middle">không xoá</text>
  </g>
</svg>
