<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-label="Căn chunk VGGT hiện tại: xoay R lấy từ hướng camera, tỉ lệ s và dịch t khớp điểm VGGT với điểm MVS để về hệ COLMAP, rồi nhân s_m từ mốc scale để ra mét">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B73"/></marker>
  </defs>
  <rect width="720" height="200" fill="#FFFFFF"/>
  <g font-family="Calibri, Arial, sans-serif" fill="#10303A">
    <!-- brackets -->
    <path d="M118 34 V24 H462 V34" fill="none" stroke="#1E7A8C" stroke-width="1.5"/>
    <text x="290" y="17" font-size="13" font-weight="bold" fill="#1E7A8C" text-anchor="middle">Bước 1 · Sim(3) cho từng chunk (13)–(17)</text>
    <path d="M478 34 V24 H716 V34" fill="none" stroke="#B9781B" stroke-width="1.5"/>
    <text x="597" y="17" font-size="13" font-weight="bold" fill="#B9781B" text-anchor="middle">Bước 2 · mốc scale (4), (18)</text>

    <rect x="4" y="44" width="100" height="92" rx="6" fill="#F4F7F8" stroke="#D5DEE2"/>
    <text x="54" y="72" font-size="13" font-weight="bold" text-anchor="middle">Chunk VGGT</text>
    <text x="54" y="92" font-size="12" text-anchor="middle">12 ảnh, gối 2</text>
    <text x="54" y="110" font-size="12" text-anchor="middle" fill="#5B6B73">gốc toạ độ riêng</text>
    <line x1="104" y1="90" x2="116" y2="90" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="118" y="44" width="110" height="92" rx="6" fill="#1E7A8C"/>
    <text x="173" y="70" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Xoay R</text>
    <text x="173" y="90" font-size="12" fill="#FFFFFF" text-anchor="middle">trung bình hướng</text>
    <text x="173" y="106" font-size="12" fill="#FFFFFF" text-anchor="middle">camera (SVD),</text>
    <text x="173" y="122" font-size="12" fill="#FFFFFF" text-anchor="middle">bỏ view lệch</text>
    <line x1="228" y1="90" x2="240" y2="90" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="242" y="44" width="110" height="92" rx="6" fill="#1E7A8C"/>
    <text x="297" y="70" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Tỉ lệ s, dịch t</text>
    <text x="297" y="90" font-size="12" fill="#FFFFFF" text-anchor="middle">khớp điểm VGGT</text>
    <text x="297" y="106" font-size="12" fill="#FFFFFF" text-anchor="middle">↔ điểm MVS</text>
    <text x="297" y="122" font-size="12" fill="#FFFFFF" text-anchor="middle">cùng pixel</text>
    <line x1="352" y1="90" x2="364" y2="90" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="366" y="44" width="96" height="92" rx="6" fill="#E8F2F4" stroke="#1E7A8C"/>
    <text x="414" y="72" font-size="13.5" font-weight="bold" text-anchor="middle">Hệ COLMAP</text>
    <text x="414" y="92" font-size="12" text-anchor="middle">đơn vị tuỳ ý</text>
    <text x="414" y="110" font-size="12" text-anchor="middle" fill="#5B6B73">8/8 chunk nhận</text>
    <line x1="462" y1="90" x2="476" y2="90" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="478" y="44" width="124" height="92" rx="6" fill="#E8A33D"/>
    <text x="540" y="70" font-size="13.5" font-weight="bold" text-anchor="middle">× s_m</text>
    <text x="540" y="90" font-size="12" text-anchor="middle">L_real / L_model</text>
    <text x="540" y="106" font-size="12" text-anchor="middle">2,4105 / 6,7676</text>
    <text x="540" y="122" font-size="12" font-weight="bold" text-anchor="middle">= 0,3562 m/đv</text>
    <line x1="602" y1="90" x2="614" y2="90" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="616" y="44" width="100" height="92" rx="6" fill="#E9F5EE" stroke="#3E9B6B"/>
    <text x="666" y="80" font-size="14" font-weight="bold" fill="#2E7A52" text-anchor="middle">Mét</text>
    <text x="666" y="100" font-size="12" text-anchor="middle">cả scene</text>

    <text x="4" y="164" font-size="12.5" fill="#5B6B73">align.method = orientation_depth, scale_from = points (lệch #37, #43).</text>
    <text x="4" y="184" font-size="12.5" fill="#5B6B73">Sau đổi cách căn (scene dev): lệch VGGT–COLMAP trung vị 8,9 cm, xoay lệch 0,7–2,8° mỗi chunk.</text>
  </g>
</svg>
