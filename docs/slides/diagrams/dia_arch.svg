<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 540" width="770" height="540" role="img" aria-label="Kiến trúc hiện tại: app Unity gửi ảnh, pose và mốc lên backend FastAPI; máy GPU chạy 9 stage, SfM trên tập dày rồi chọn keyframe, hai nhánh MVS và VGGT gặp nhau ở align; GLB mét trả về app">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B73"/></marker>
  </defs>
  <rect width="770" height="540" fill="#FFFFFF"/>
  <g font-family="Calibri, Arial, sans-serif" fill="#10303A">
    <!-- lanes -->
    <rect x="4" y="4" width="176" height="532" rx="8" fill="#F4F7F8" stroke="#D5DEE2" stroke-dasharray="5 4"/>
    <rect x="192" y="4" width="160" height="532" rx="8" fill="#F4F7F8" stroke="#D5DEE2" stroke-dasharray="5 4"/>
    <rect x="364" y="4" width="402" height="532" rx="8" fill="#F4F7F8" stroke="#D5DEE2" stroke-dasharray="5 4"/>
    <text x="92" y="24" font-size="13" font-weight="bold" fill="#5B6B73" text-anchor="middle">ĐIỆN THOẠI · APP UNITY</text>
    <text x="272" y="24" font-size="13" font-weight="bold" fill="#5B6B73" text-anchor="middle">BACKEND FASTAPI</text>
    <text x="565" y="24" font-size="13" font-weight="bold" fill="#5B6B73" text-anchor="middle">MÁY GPU · 9 STAGE, GIAO TIẾP QUA FILE</text>

    <!-- phone -->
    <rect x="16" y="45" width="152" height="54" rx="6" fill="#FFFFFF" stroke="#1E7A8C"/>
    <text x="92" y="67" font-size="14" font-weight="bold" text-anchor="middle">1 · Quay phòng</text>
    <text x="92" y="86" font-size="12" text-anchor="middle">ảnh + pose ARCore</text>
    <line x1="92" y1="99" x2="92" y2="128" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="16" y="130" width="152" height="84" rx="6" fill="#FDF3E3" stroke="#E8A33D"/>
    <text x="92" y="151" font-size="14" font-weight="bold" text-anchor="middle">2 · Chọn cách ra mét</text>
    <text x="92" y="170" font-size="12" text-anchor="middle">tape: chạm 2 đầu mút</text>
    <text x="92" y="185" font-size="12" text-anchor="middle">+ nhập số thước (4)</text>
    <text x="92" y="203" font-size="12" text-anchor="middle" fill="#5B6B73">ar: quỹ đạo ARCore (≈ 2%)</text>
    <rect x="16" y="452" width="152" height="72" rx="6" fill="#FFFFFF" stroke="#1E7A8C"/>
    <text x="92" y="474" font-size="14" font-weight="bold" text-anchor="middle">3 · Xem GLB, đo</text>
    <text x="92" y="494" font-size="12" text-anchor="middle">chạm 2 điểm</text>
    <text x="92" y="511" font-size="12" text-anchor="middle">→ khoảng cách (30)</text>

    <!-- api -->
    <rect x="206" y="226" width="132" height="104" rx="6" fill="#FFFFFF" stroke="#1E7A8C"/>
    <text x="272" y="249" font-size="14" font-weight="bold" text-anchor="middle">Hàng đợi 1 job</text>
    <text x="272" y="270" font-size="12" text-anchor="middle">tạo job, chạy</text>
    <text x="272" y="286" font-size="12" text-anchor="middle">pipeline.run</text>
    <text x="272" y="304" font-size="12" text-anchor="middle">trả model.glb</text>
    <text x="272" y="321" font-size="11" text-anchor="middle" fill="#5B6B73">chạy tiếp job dở</text>
    <path d="M168 172 H272 V224" fill="none" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="278" y="200" font-size="11.5" fill="#5B6B73">ảnh, pose, mốc</text>
    <path d="M272 330 V488 H170" fill="none" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="278" y="420" font-size="11.5" fill="#5B6B73">GLB (mét)</text>

    <!-- gpu -->
    <path d="M338 250 H392 V68 H412" fill="none" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="388" y="150" font-size="11.5" fill="#5B6B73" text-anchor="end">job</text>
    <rect x="414" y="45" width="302" height="46" rx="6" fill="#1E7A8C"/>
    <text x="565" y="64" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">keyframe</text>
    <text x="565" y="82" font-size="12" fill="#FFFFFF" text-anchor="middle">lọc mờ, phơi sáng, trùng → tập ứng viên dày</text>
    <line x1="565" y1="91" x2="565" y2="113" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="414" y="115" width="302" height="46" rx="6" fill="#1E7A8C"/>
    <text x="565" y="134" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">sfm (COLMAP, exhaustive)</text>
    <text x="565" y="152" font-size="12" fill="#FFFFFF" text-anchor="middle">SfM trên tập dày → chọn 40–80 keyframe đã đăng ký</text>
    <line x1="510" y1="161" x2="490" y2="193" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="630" y1="161" x2="672" y2="193" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="492" y="180" font-size="11" fill="#5B6B73" text-anchor="end">pose + ảnh</text>
    <text x="664" y="180" font-size="11" fill="#5B6B73">keyframe</text>
    <rect x="404" y="195" width="172" height="46" rx="6" fill="#1E7A8C"/>
    <text x="490" y="214" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">mvs (COLMAP)</text>
    <text x="490" y="232" font-size="12" fill="#FFFFFF" text-anchor="middle">điểm dày, e_reproj, σ_depth</text>
    <rect x="586" y="195" width="172" height="46" rx="6" fill="#1E7A8C"/>
    <text x="672" y="214" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">vggt</text>
    <text x="672" y="232" font-size="12" fill="#FFFFFF" text-anchor="middle">chunk 12 ảnh, gối 2, bf16</text>
    <line x1="490" y1="241" x2="515" y2="273" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="672" y1="241" x2="625" y2="273" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="496" y="264" font-size="11" fill="#5B6B73" text-anchor="end">điểm MVS</text>
    <text x="656" y="264" font-size="11" fill="#5B6B73">điểm theo chunk</text>
    <rect x="414" y="275" width="302" height="46" rx="6" fill="#E8A33D"/>
    <text x="565" y="294" font-size="14" font-weight="bold" text-anchor="middle">align</text>
    <text x="565" y="312" font-size="12" text-anchor="middle">R từ hướng camera; s, t khớp điểm MVS; × s_m</text>
    <line x1="565" y1="321" x2="565" y2="343" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="414" y="345" width="302" height="46" rx="6" fill="#1E7A8C"/>
    <text x="565" y="364" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">fuse</text>
    <text x="565" y="382" font-size="12" fill="#FFFFFF" text-anchor="middle">6 tín hiệu → trọng số w̃, độ tin cậy w_k (19)–(22)</text>
    <line x1="565" y1="391" x2="565" y2="413" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="414" y="415" width="302" height="46" rx="6" fill="#1E7A8C"/>
    <text x="565" y="434" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">gate</text>
    <text x="565" y="452" font-size="12" fill="#FFFFFF" text-anchor="middle">RANSAC ≤ 8 mặt, cổng 4 điều kiện (24)–(25)</text>
    <line x1="565" y1="461" x2="565" y2="483" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="414" y="485" width="302" height="46" rx="6" fill="#1E7A8C"/>
    <text x="565" y="504" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">export</text>
    <text x="565" y="522" font-size="12" fill="#FFFFFF" text-anchor="middle">Poisson độ sâu 8, màu đỉnh, Taubin → GLB mét</text>
    <path d="M414 508 H380 V300 H340" fill="none" stroke="#5B6B73" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="374" y="480" font-size="11.5" fill="#5B6B73" text-anchor="end">model.glb</text>
  </g>
</svg>
