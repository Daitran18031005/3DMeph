# configs/default.yaml — tham số của pipeline 3DMeph.
# Mỗi khoá được mô tả trong README của module tương ứng (pipeline/<module>/README.md) và được
# scripts/check_docs.py đối chiếu hai chiều. `null` = chưa có căn cứ trong đề cương, phải đo/khoá
# trên 6 scene ARKitScenes Validation (xem configs/README.md). ĐC = đề cương, "(n)" = số công thức.

keyframe:
  fps: 2                      # ĐC §7: trích 1–2 khung/giây
  target_min: 40              # ĐC §7: 40–80 keyframe mỗi lượt (đếm trên ảnh đã đăng ký SfM)
  target_max: 80              # ĐC §7: 40–80 keyframe mỗi lượt; stage sfm chọn từ tập ứng viên dày (M2: SfM trên 80 khung thưa chỉ đăng ký 8–40%)
  rotate_from_sky: true       # xoay ảnh upright theo sky_direction (quyết định của nhóm)
  overlap:
    max: 0.99                 # tập ứng viên cho SfM: chỉ bỏ khung gần như giống hệt [Suy luận; 0,8 làm SfM đứt chuỗi, M2]
    min: 0.3                  # dưới mức này coi là mất kết nối [Suy luận từ ĐC §6.1; M2 nới từ 0,6]; KHOÁ 07/11 (người dùng): SfM với 0,2/0,3/0,5 cho trung vị đăng ký 95,9/95,9/96,6%, chênh chỉ 1 keyframe ở 2 scene nên giữ 0,3
  blur:
    q_drop: 0.35              # loại khung có q_blur dưới ngưỡng; KHOÁ 31/10 (người dùng): quét 0,2/0,35/0,5 trên 6 Validation cho đăng ký trung vị 96,4/95,9/93,7%, chênh không đủ kết luận nên giữ 0,35
  exposure:
    q_drop: 0.5               # loại khung có q_exposure dưới ngưỡng (tối/cháy, ĐC §7.2 không nêu số); KHOÁ 07/11: quét 0,3/0,5/0,7 trên 6 Validation đều loại 0 khung (docs/evidence/m2_sfm/after_07-11/)

video:                        # nguồn video điện thoại (dữ liệu tự thu); mọi khoá là [Suy luận], chưa chạy trên video thật
  source_dir: data/self_collected   # chứa <id>/ với đúng một file mp4/mov/m4v; tương đối so với gốc repo, ngoài git
  long_edge: 640              # px: hạ ảnh về cạnh dài này trước khi đo blur, để dùng đúng V_ref/G_ref đo trên vga_wide 640×480; không phóng to
  focal35_mm: 26              # TẠM: tiêu cự tương đương 35 mm khi video không có metadata tiêu cự (camera chính điện thoại thường 24–28); COLMAP tinh chỉnh

quality:
  v_ref:                    # (3): trung vị qua scene của blur trung bình, đo trên vga_wide của 6 Validation
    vga: 205.69
    measured_on: validation   # split = val trong splits.csv, asset vga_wide
    n_scenes: 6
    date: "2026-10-18"
    stride: 10               # lấy mẫu mỗi 10 khung
  g_ref:                      # (20): trung vị qua scene của gradient cửa sổ 15×15 trung bình
    vga: 29.01
    measured_on: validation   # split = val trong splits.csv, asset vga_wide
    n_scenes: 6
    date: "2026-10-18"
    stride: 10               # lấy mẫu mỗi 10 khung
  window: 15                  # ĐC §16.1: cửa sổ 15×15 px quanh điểm cho q_texture
  dark_px: 5                  # (20): pixel ≤ 5 là quá tối
  bright_px: 250              # (20): pixel ≥ 250 là cháy sáng

colmap:
  camera_model: PINHOLE       # intrinsics lấy từ camera.json
  matcher: exhaustive         # exhaustive | sequential; M2: sequential đứt chuỗi ở đoạn xoay máy, exhaustive nối được các đoạn
  matcher_overlap: null       # số cặp láng giềng của sequential_matcher (chỉ khi matcher: sequential); chưa có căn cứ (mặc định COLMAP)
  sift:                       # tham số trích đặc trưng; TẠM, đo trên 3 scene ở M2 (47204552, 42898849, 42444738)
    peak_threshold: 0.004     # SiftExtraction.peak_threshold (mặc định COLMAP 0,00667): thêm đặc trưng ở vùng ít hoạ tiết
    estimate_affine_shape: true   # SiftExtraction.estimate_affine_shape
    domain_size_pooling: true     # SiftExtraction.domain_size_pooling
  mapper:                     # nới ngưỡng mapper cho video quay tay ít thị sai; TẠM, đo trên 3 scene ở M2
    init_min_tri_angle: 2     # Mapper.init_min_tri_angle (mặc định 16)
    init_min_num_inliers: 30  # Mapper.init_min_num_inliers (mặc định 100)
    abs_pose_min_num_inliers: 10   # Mapper.abs_pose_min_num_inliers (mặc định 30)
    abs_pose_min_inlier_ratio: 0.05   # Mapper.abs_pose_min_inlier_ratio (mặc định 0,25)
    min_num_matches: 10       # Mapper.min_num_matches (mặc định 15)
    abs_pose_max_error: 16    # Mapper.abs_pose_max_error, px (mặc định 12)
  stereo_fusion:              # StereoFusion.* của `stereo_fusion`: cấu hình "d3" làm chuẩn cho mọi biến thể từ M4 đợt 3 (người dùng duyệt 13/11; ĐC không nêu số)
    min_num_pixels: 2         # StereoFusion.min_num_pixels (mặc định COLMAP 5)
    max_reproj_error: 8       # StereoFusion.max_reproj_error, px (mặc định 2)
    max_depth_error: 0.05     # StereoFusion.max_depth_error (mặc định 0,01)
    max_normal_error: 30      # StereoFusion.max_normal_error, độ (mặc định 10)
    check_num_images: 100     # StereoFusion.check_num_images (mặc định 50)
  geom_consistency: true      # PatchMatchStereo.geom_consistency, tạo cả depth photometric và geometric
  max_image_size: null        # null = giữ nguyên kích thước ảnh
  use_gpu: true               # false = SIFT và ghép cặp trên CPU (patch_match_stereo vẫn cần CUDA); dùng khi driver quá cũ cho bản COLMAP CUDA 13

vggt:
  chunk: 12                   # (2): c = 8–16 ảnh mỗi chunk (GPU 8 GB)
  overlap: 2                  # (2): o = 2 ảnh gối
  dtype: bf16
  vram_fraction: 0.95   # trần VRAM của PyTorch (tỉ lệ dung lượng GPU); trên Windows (WDDM) không có trần thì cấp phát tràn sang RAM hệ thống và chậm gấp ~2 lần; 0 = không đặt trần
  weights_dir: ../vggt_weights/VGGT-1B   # thư mục chứa config.json và model.safetensors (facebook/VGGT-1B, cc-by-nc-4.0); tương đối so với gốc repo, ngoài git
  c_model_map: one_minus_inv  # c = 1 − 1/conf (conf = 1+exp(x) ∈ [1,∞)); [Suy luận, đã xác nhận]

align:
  method: orientation_depth   # centers = ĐC §15.1 (tâm camera, RANSAC + Umeyama); orientation_depth = LỆCH ĐC: xoay từ hướng camera, scale từ khoảng cách điểm MVS, tịnh tiến từ tâm camera
  scale_from: points          # chỉ cho orientation_depth. points = scale khớp điểm VGGT–MVS (giữ khoảng cách giữa hai điểm); distances = trung vị tỉ lệ khoảng cách camera→điểm (cách cũ, thấp hơn 4–19% trên dev). LỆCH ĐC, WORKING_LOG 05/11
  min_pairs: 3                # §15.1: n ≥ 3 cặp tâm camera
  ransac:
    max_error_ratio: 1.5      # ngưỡng inlier / khoảng cách camera trung vị; TẠM cho M1 (chọn trên dev 42444738 bằng CV và nhất quán ảnh gối, xem WORKING_LOG), khoá lại ở M2 trên Validation
  anchor_file: ground_truth/scale_anchor.json   # mốc scale 1–2 m, §8.1

fusion:
  tau_e: 2.0                  # (19): px, "minh họa" §16.1; đã khoá 12/11 (M4, 5 Validation, quét 3 giá trị, không giá trị nào qua quy tắc → giữ mặc định)
  tau_sigma: 0.20             # (19): m, "minh họa" §16.1; đã khoá 12/11 (M4, 5 Validation, quét 3 giá trị, không giá trị nào qua quy tắc → giữ mặc định)
  e_cap_px: 4.0               # e_reproj gán cho vùng ngoài nội suy [Suy luận: ngưỡng RANSAC 1–4 px, §14.1]
  use_quality: true           # false = Ablation 1 (bỏ q_blur, q_texture, q_exposure)
  max_shift_m: null           # [Suy luận, M4 đợt 2 hướng B] m: kẹp ‖P̂_k − điểm MVS‖ ≤ giá trị này; null = không kẹp (hành vi cũ), 0 = giữ đúng vị trí MVS
  mvs_cloud: fused.ply          # [Suy luận, M4 đợt 2 hướng D] tên PLY MVS trong baselines/colmap/mvs/ mà `fuse` đọc (kèm <tên>.vis); biến thể dày hơn do scripts/stereo_fusion_variant.py ghi
  fill_enabled: false         # [Suy luận, M4 đợt 2 hướng A] true = thêm điểm VGGT vào ô voxel MVS không có điểm (không thuộc đề cương)
  fill_voxel_m: 0.10          # m: cạnh ô voxel (hướng A; đặt trước khi chạy, không chỉnh theo kết quả)
  fill_min_views: 3           # số view khác nhau phải có điểm VGGT trong cùng ô (hướng A)
  fill_min_conf: 0.5          # c_model tối thiểu của điểm VGGT ứng viên (hướng A)
  fill_stride: 4              # lấy mỗi n pixel trên lưới VGGT (hướng A)
  filter_min_views: null      # [Suy luận, M4 đợt 3] f1: bỏ điểm có ít hơn n view lấy được; null = tắt (hành vi cũ)
  filter_sor_std_ratio: null  # [Suy luận, M4 đợt 3] f2: ngoại lai thống kê, bỏ điểm có khoảng cách TB tới k láng giềng > TB + giá trị × độ lệch chuẩn; null = tắt
  filter_sor_k: 20            # số láng giềng của f2 (cố định 20, chỉ quét thử 10 và 40)

plane:
  tau_r: 0.05                 # (24): m, ví dụ §17.1; đã khoá 12/11 (M4, 5 Validation, quét 3 giá trị, không giá trị nào qua quy tắc → giữ mặc định)
  tau_n_deg: 15               # (24): độ, ví dụ §17.1; đã khoá 12/11 (M4, 5 Validation, quét 3 giá trị, không giá trị nào qua quy tắc → giữ mặc định)
  tau_w: 0.5                  # (24): ví dụ §17.1; đã khoá 12/11 (M4, 5 Validation, quét 3 giá trị, không giá trị nào qua quy tắc → giữ mặc định)
  alpha: 0.5                  # (25): ví dụ §17.2 (khác loss.alpha_r); đã khoá 12/11 (M4, 5 Validation, quét 3 giá trị, không giá trị nào qua quy tắc → giữ mặc định)
  up_refine_deg: 20           # tinh chỉnh hướng lên trong 20° quanh (0,−1,0) camera (quyết định của nhóm)
  force: false                # true = Ablation 2: kéo mọi điểm về mặt phẳng, không cổng
  max_planes: 8               # RANSAC tuần tự: tối đa số mặt phẳng; TẠM cho M1 [Suy luận]
  min_inlier_fraction: 0.02   # mỗi mặt phẳng phải có ≥ tỉ lệ này số điểm; TẠM cho M1 [Suy luận]
  normal_knn: 30              # số láng giềng của PCA pháp tuyến cục bộ (θ_k, Poisson); TẠM cho M1 [Suy luận]
  gate_normal_knn: 300        # k của pháp tuyến cho cổng; khoá ngày 15/11 (M4 đợt 3d: k = 100 không đạt, 300 đạt); null = dùng normal_knn (cũ). Khoá riêng vì normal_knn còn dùng cho Poisson ở export
  floor_rule: lowest          # khoá ngày 15/11 (M4 đợt 3d) [Suy luận]: lowest = chỉ mặt ngang thấp nhất (± floor_band_m) là sàn, cao nhất là trần, còn lại horizontal_other; any = mọi mặt ngang dưới camera là sàn (cũ)
  floor_band_m: 0.0           # m: mặt ngang cách mặt thấp nhất (hoặc cao nhất) không quá giá trị này vẫn là sàn (hoặc trần); chỉ dùng khi floor_rule = lowest. 0 vì gate_A (band 0) đạt; thử 0,10 cũng đạt nhưng không cần
  min_walls: 1                # khoá ngày 15/11 [Suy luận]: số tường tối thiểu, thiếu thì chạy thêm lượt RANSAC mặt đứng; 0 = tắt (cũ)
  extra_wall_passes: 4        # số lượt RANSAC mặt đứng thêm tối đa khi thiếu tường (chỉ dùng khi min_walls > 0)
  detector: ransac            # lệch #53 [Suy luận]: ransac = RANSAC tuần tự cũ (find_planes); refined = RANSAC mỏng + lọc pháp tuyến + tách mảng DBSCAN + khớp PCA bền (find_planes_refined)
  gate_scope: struct          # struct = chỉ sàn/trần/tường theo ĐC (24); all = mọi mặt tìm được, kể cả đồ đạc (lệch #54)
  refined:                    # chỉ dùng khi detector = refined; chọn trên Replica dev (hotel_0, frl_apartment_0), lệch #53
    ransac_m: 0.02            # m: độ dày RANSAC đề xuất mặt phẳng
    normal_deg: 20            # độ: pháp tuyến cục bộ của inlier phải lệch mặt đề xuất dưới giá trị này
    cluster_eps_m: 0.05       # m: bán kính DBSCAN tách inlier thành mảng liền
    min_points: 2000          # số điểm tối thiểu của một mặt (và của một đề xuất)
    max_proposals: 60         # số vòng RANSAC đề xuất tối đa
    merge_deg: 0              # độ: gộp mảng đồng phẳng có pháp tuyến lệch dưới giá trị này (0 = không gộp)
    merge_m: 0                # m: và mặt này cách tâm mảng kia dưới giá trị này
  locked:                     # cấu hình gate khoá trên Replica dev cho --variant refined_struct / refined_all (lệch #53/#54); null = chưa khoá
    # khoá 20/11 từ lưới refined2 (128 cấu hình × 2 dev): ΔP2Plane TB −1,38% (struct), −1,48% (all), ΔF ≥ −0,01 cả hai dev
    refined_struct: {detector: refined, gate_scope: struct, refined: {ransac_m: 0.01, cluster_eps_m: 0.05, min_points: 500}, tau_w: 0.0, alpha: 1.0}
    refined_all: {detector: refined, gate_scope: all, refined: {ransac_m: 0.01, cluster_eps_m: 0.10, min_points: 500}, tau_w: 0.0, alpha: 1.0}

export:
  poisson_depth: 8            # Open3D Poisson; [Suy luận] 8–9
  up_axis: y                  # glTF dùng +Y là lên
  density_quantile: 0.2       # cắt đỉnh Poisson có mật độ dưới phân vị này (bề mặt bịa ở vùng không có dữ liệu); 0,05 → 0,2 ngày 17/11 sau khi so ảnh smi_a_4153 (0,2 bỏ mảng bịa, 0,35 mất phần thật); chỉ mesh để xem [Suy luận]
  smooth_iters: 50            # làm mịn Taubin sau Poisson (0 = tắt); chỉ đổi mesh để xem, chỉ số eval tính trên điểm [Suy luận]
  flatten_planes_m: 0.08      # chỉ mesh để xem: chiếu điểm lên mặt sàn/tường/trần gần nhất (tường thẳng đứng, sàn ngang) nếu cách ≤ ngưỡng; 0 = tắt [Suy luận]
  fill_vggt_voxel_m: 0.05     # chỉ mesh để xem: lấp ô voxel MVS trống bằng điểm VGGT (0 = tắt) [Suy luận]
  fill_vggt_min_views: 1      # ô lấp cần điểm VGGT từ ≥ số view khác nhau [Suy luận]
  fill_vggt_min_conf: 0.1     # c_model tối thiểu của điểm VGGT dùng lấp lỗ cho mesh xem (tường trơn có c_model thấp) [Suy luận]

measure:                      # scripts/pick_endpoints.py: chọn đầu mút trên mô hình, GT thước dây, so sai số
  tape_readings: 3            # ĐC §8.3: đo thước dây 3 lần, lấy trung vị
  anchor_min_m: 1.0           # ĐC §8.1: mốc scale dài 1–2 m
  anchor_max_m: 2.0           # ĐC §8.1
  under_cm: 5.0               # %<ngưỡng: tỉ lệ đoạn sai số dưới ngưỡng này (mục tiêu ĐC §21: median < 5 cm)

eval:
  snap_radius_m: 0.02         # bán kính snap đầu mút vào point cloud mô hình (quyết định của nhóm, 2 cm)
  mode: manual                # manual (chọn trực tiếp trên point cloud) | auto (căn cứng, scale cố định)
  delta_m: 0.05               # δ của Prec/Rec/F-score (35) [ĐC (35)]
  plane:                      # Replica (M5): P2Plane, PlaneRecall (36) theo preseg; đặt trước khi chấm [Suy luận]
    min_area_m2: 0.5          # segment `plane` nhỏ hơn thì không là mặt GT
    assign_m: 0.10            # điểm mô hình gán cho mẫu GT gần nhất nếu cách ≤ ngưỡng
    min_points: 200           # mặt GT cần ≥ số điểm gán để được chấm
    max_angle_deg: 10         # "tìm thấy": lệch pháp tuyến ≤ ngưỡng
    max_offset_m: 0.05        # "tìm thấy": lệch vị trí tại tâm ≤ ngưỡng
  b1:
    stride: 4                 # bước lấy mẫu pixel khi dựng point cloud B1 [Suy luận, TẠM]
    c_min: 0.5                # chỉ giữ điểm VGGT có c_model ≥ c_min (nối chunk và B1) [Suy luận, TẠM]
  align:
    trim_k: 3.0               # Kabsch cắt tỉa tâm camera: bỏ camera có residual > trim_k × trung vị rồi căn lại; KHOÁ 09/11 (người dùng), không chỉnh theo kết quả
    trim_max_iters: 5         # số lượt cắt tỉa tối đa (dừng sớm khi tập giữ lại không đổi); KHOÁ 09/11 (người dùng 'lặp tới hội tụ')
  region:                     # vùng đánh giá Chamfer/F (lệch #46); KHOÁ 09/11, không chỉnh theo kết quả
    mode: visible_gt          # MẶC ĐỊNH visible_gt từ 09/11 (người dùng duyệt). box (hộp quỹ đạo GT, đối chiếu số cũ) | visible_gt (Faro được keyframe thấy) | visible_both (thêm: mô hình thấy và gần Faro)
    z_range_m: [0.5, 4.5]     # độ sâu camera → điểm được coi là thấy (mặc định của point_visibility)
    occl_m: 0.12              # dung sai z-buffer che khuất (m)
    margin_px: 20             # điểm cách mép ảnh < margin_px coi là không thấy
    gt_support_m: 0.10        # visible_both: bỏ điểm mô hình nếu trong bán kính này không có điểm Faro
  crop_margin_m: 1.0         # lề quanh hộp quỹ đạo camera GT khi cắt Faro và mô hình cho Chamfer/F [Suy luận, TẠM]
  voxel_m: 0.02               # voxel hoá trước khi tính Chamfer/F [Suy luận, TẠM]
  icp_max_dist_m: 0.10        # khoảng ghép tối đa của ICP cứng scale = 1 [Suy luận, TẠM]

loss:
  alpha_r: null               # (29): hệ số phạt L_reg; mốc train head, chưa dùng

paths:
  colmap_exe: ${COLMAP_EXE}   # biến môi trường; mặc định ../colmap/bin/colmap.exe so với repo
  data_root: data/scenes      # cây thư mục Mục 9 (ĐC §9)
  splits: data/splits.csv     # danh sách train/val/heldout
